<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Not found · Turtle Games</title>
  <style>
    :root { --cream: #f4efe4; --ink: #0c0c0c; --red: #b91c1c; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--cream); color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px; text-align: center;
    }
    h1 { font-size: clamp(40px, 9vw, 80px); line-height: 1; margin: 0 0 12px; letter-spacing: -0.02em; }
    p  { max-width: 36ch; font-size: 17px; line-height: 1.45; margin: 0; }
    .card {
      border: 2px solid var(--ink); background: white; border-radius: 2px;
      padding: 28px 24px; box-shadow: 4px 4px 0 0 var(--ink);
      max-width: 460px; width: 100%;
    }
    .label {
      display: inline-block;
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 6px 12px; border-radius: 999px;
      background: var(--red); color: white;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="label">404</div>
      <h1>🐢💨</h1>
      <p>This game doesn't exist or has expired. Open Turtle to start a new one.</p>
    </div>
  </main>
</body>
</html>
