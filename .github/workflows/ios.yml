name: ios

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "ios/**"
      - "commands/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect iOS project
        id: ios
        run: |
          if find ios -name "*.xcodeproj" -o -name "*.xcworkspace" 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS source not yet present in repo — skipping xcodebuild."
          fi

      - name: Build and test
        if: steps.ios.outputs.exists == 'true'
        run: |
          xcodebuild test \
            -scheme TurtleKeyboard \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO
