name: Design system · Pages

# Publishes the design-system preview + raw token files to GitHub Pages on
# every merge to main so designers have stable URLs for browsing the system.
#
#   /                     -> preview.html (live token gallery)
#   /token.json           -> merged W3C DTCG tokens (build input)
#   /Value.tokens*.json   -> raw per-collection Figma exports

on:
  push:
    branches: [main]
    paths:
      - "design-system/preview.html"
      - "design-system/token.json"
      - "design-system/Value.tokens*.json"
      - ".github/workflows/design-system-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-system-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site
        run: |
          mkdir -p _site
          cp design-system/preview.html _site/index.html
          cp design-system/token.json   _site/token.json
          cp design-system/Value.tokens*.json _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
