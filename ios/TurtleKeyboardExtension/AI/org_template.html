<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=500,initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: #0c0c0c;
  }
  /* Fixed 500x500 canvas — html-to-image rasterizes this node. */
  #canvas {
    width: 500px;
    height: 500px;
    box-sizing: border-box;
    padding: 28px;
    background: #f4efe4;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  #target { width: 100%; }

  h3 {
    margin: 0 0 16px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
  }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
    border: 2px solid #0c0c0c;
    background: #ffffff;
  }
  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid #0c0c0c;
    text-align: left;
  }
  thead th { background: #15803d; color: #ffffff; font-weight: 700; }
  tfoot td { border-top: 2px solid #0c0c0c; border-bottom: none; background: #f4efe4; }

  /* Definition list */
  dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px 18px;
    font-size: 18px;
    margin: 0;
  }
  dt { font-weight: 700; }
  dd { margin: 0; }

  /* Single big stat */
  .stat { text-align: center; }
  .stat .num {
    font-size: 72px;
    font-weight: 800;
    color: #15803d;
    line-height: 1;
  }
  .stat .label {
    font-size: 18px;
    color: #444;
    margin-top: 12px;
  }

  /* Card grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .card {
    border: 2px solid #0c0c0c;
    padding: 14px;
    background: #ffffff;
    box-shadow: 4px 4px 0 0 #0c0c0c;
  }
  .card .title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .card .body { font-size: 14px; color: #333; }

  /* Lists */
  ul, ol { padding-left: 22px; font-size: 18px; margin: 0; }
  li { margin: 6px 0; }
  ul.checklist { list-style: none; padding: 0; }
  ul.checklist li { display: flex; align-items: center; gap: 10px; }
  ul.checklist li::before {
    content: "";
    width: 16px;
    height: 16px;
    border: 2px solid #0c0c0c;
    border-radius: 3px;
    display: inline-block;
    flex: 0 0 16px;
  }

  /* Callout */
  .callout {
    border: 2px solid #0c0c0c;
    border-left: 8px solid #15803d;
    padding: 14px 16px;
    background: #ffffff;
    font-size: 16px;
  }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    background: #0c0c0c;
    color: #ffffff;
  }
  .badge.green { background: #15803d; }
  .badge.pink  { background: #ff4fa3; }
</style>
</head>
<body>
  <div id="canvas">
    <div id="target"></div>
  </div>
  <script src="html-to-image.js"></script>
</body>
</html>
